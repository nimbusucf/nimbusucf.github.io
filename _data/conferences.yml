# Dashboard configuration — the single data file for the Dashboard page.
#
# selected: acronyms of conferences to track. Each name must match a file in
#           the ccfddl/ccf-deadlines repository (conference/**/<name>.yml,
#           lowercase). Checked once a day by
#           .github/workflows/update-deadlines.yml; deadlines in the AUTO
#           section below are refreshed automatically.
#
# manual:   deadlines outside ccfddl — hand-maintained, never overwritten.
#           Example:
#             - name: NIMBUS Symposium
#               year: 2027
#               link: https://example.com
#               timezone: UTC-5          # optional, default UTC
#               deadlines:
#                 - type: Full Paper Submission
#                   date: "2027-01-15 23:59:59"
#                 - type: Registration
#                   date: "2027-02-01 23:59:59"
#
# The section between the AUTO markers is rewritten by
# bin/update_ccf_deadlines.py — do not edit it by hand.

selected:
  - miccai
  - cvpr
  - iccv
  - eccv
  - icml
  - nips
  - aaai
  - ijcai
  - ismb
  - acl
  - ijcnn
  - iclr
  - wacv
  - iros

manual:
